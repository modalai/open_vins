name: Host math and calibration

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, calibration-refinement]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-math-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-math:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ libeigen3-dev libopencv-dev libopencv-contrib-dev \
            libboost-dev libboost-system-dev libboost-filesystem-dev \
            libboost-thread-dev libboost-date-time-dev
      - name: Configure all numerical and calibration regressions
        run: |
          cmake -S . -B build-host -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DENABLE_ROS=OFF \
            -DENABLE_ARUCO_TAGS=ON -DDISABLE_MATPLOTLIB=ON \
            -DOV_INIT_CERES_FREE=ON -DBUILD_OV_EVAL=OFF \
            -DOV_CORE_BUILD_TESTS=ON -DOV_INIT_BUILD_TESTS=ON \
            -DOV_MSCKF_BUILD_TESTS=ON \
            -DOV_BUILD_CALIB=ON -DOV_ZCALIB_BUILD_TESTS=ON
      - name: Build host regression binaries
        run: cmake --build build-host --target ov_host_tests --parallel "$(nproc)"
      - name: Run every registered regression
        working-directory: build-host
        run: |
          ctest --output-on-failure --output-junit host-math.xml --parallel "$(nproc)"
      - name: Preserve regression evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-math-${{ github.sha }}
          path: |
            build-host/host-math.xml
            build-host/Testing/Temporary/
            build-host/ov_msckf/test_async_dual_frame_clones_global.csv
          if-no-files-found: warn
          retention-days: 14
